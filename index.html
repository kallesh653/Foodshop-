<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="description" content="Foodshop - Fresh Fruits, Vegetables & Food Products">
  <title>Foodshop</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Favicon (emoji) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥦</text></svg>">
</head>
<body>

<!-- ============================================================
     BANNER
     ============================================================ -->
<div class="banner">
  <img id="banner-img"
    src="https://images.unsplash.com/photo-1542838132-92c53300491e?w=800&q=80"
    alt="Banner"
    class="banner-img">
  <div class="banner-overlay"></div>
  <div class="banner-logo">
    <img id="banner-logo-img"
      src="https://images.unsplash.com/photo-1611735341450-74d61e660ad2?w=200&q=80"
      alt="Logo">
    <h2 id="banner-name">Foodshop</h2>
    <span id="banner-tagline">General Trading</span>
  </div>
</div>

<!-- ============================================================
     MAIN CONTAINER
     ============================================================ -->
<div class="main-container">

  <!-- Profile Section -->
  <div style="position:relative;">
    <div class="profile-section">
      <img id="profile-avatar"
        src="https://images.unsplash.com/photo-1611735341450-74d61e660ad2?w=200&q=80"
        alt="Profile"
        class="profile-avatar">
      <div class="profile-info">
        <h1 id="owner-name">Owner Name</h1>
        <p id="owner-role">Owner and Manager</p>
      </div>
    </div>
    <div class="views-badge">
      <span class="dot"></span>
      <span id="views-count">0</span> Views
    </div>
  </div>

  <!-- ---- BUSINESS DETAILS CARD ---- -->
  <div class="card">
    <div class="card-header">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Business Details
      </h3>
      <span class="toggle-icon open">&#8679;</span>
    </div>
    <div class="card-body">

      <div class="detail-row">
        <div class="detail-icon">🏢</div>
        <div class="detail-content">
          <label>Business Name</label>
          <span id="biz-name">—</span>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">🏭</div>
        <div class="detail-content">
          <label>Business Category</label>
          <span id="biz-category">—</span>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">🏠</div>
        <div class="detail-content">
          <label>Address (Office)</label>
          <span id="biz-address">—</span>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">📱</div>
        <div class="detail-content">
          <label>Mobile (India)</label>
          <span id="biz-mobile-india">—</span>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">📱</div>
        <div class="detail-content">
          <label>Mobile (UAE)</label>
          <span id="biz-mobile-uae">—</span>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">✉️</div>
        <div class="detail-content">
          <label>Email</label>
          <span id="biz-email" style="color:#3db54a;text-decoration:underline;">—</span>
        </div>
      </div>

      <!-- WhatsApp Share -->
      <div class="whatsapp-share">
        <label>Share On Whatsapp</label>
        <div class="whatsapp-input-row">
          <select class="country-select" id="country-select">
            <option value="+91">+91 🇮🇳</option>
            <option value="+971">+971 🇦🇪</option>
            <option value="+1">+1 🇺🇸</option>
            <option value="+44">+44 🇬🇧</option>
            <option value="+60">+60 🇲🇾</option>
            <option value="+65">+65 🇸🇬</option>
            <option value="+966">+966 🇸🇦</option>
            <option value="+974">+974 🇶🇦</option>
            <option value="+968">+968 🇴🇲</option>
            <option value="+973">+973 🇧🇭</option>
            <option value="+49">+49 🇩🇪</option>
            <option value="+33">+33 🇫🇷</option>
            <option value="+86">+86 🇨🇳</option>
            <option value="+81">+81 🇯🇵</option>
            <option value="+61">+61 🇦🇺</option>
          </select>
          <input type="tel" class="wa-number-input" id="wa-number-input"
            placeholder="Enter Whatsapp number">
          <button class="btn-whatsapp" id="btn-wa-send" title="Send on WhatsApp">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
              <path d="M12 0C5.373 0 0 5.373 0 12c0 2.115.55 4.1 1.517 5.829L.057 23.25l5.565-1.459A11.952 11.952 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.89 0-3.659-.495-5.191-1.362L3 21.75l1.126-4.714A10 10 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
            </svg>
          </button>
          <button class="btn-share" id="btn-share" title="Share this page">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="#fff" stroke-width="2"/>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="#fff" stroke-width="2"/>
            </svg>
          </button>
        </div>
        <button class="btn-install" id="btn-install">
          📲 Install Your App
        </button>
      </div>

    </div>
  </div>

  <!-- ---- ABOUT US CARD ---- -->
  <div class="card">
    <div class="card-header">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        About Us
      </h3>
      <span class="toggle-icon open">&#8679;</span>
    </div>
    <div class="card-body">
      <p class="about-text" id="about-text">Loading...</p>
    </div>
  </div>

  <!-- ---- WHAT WE SERVE CARD ---- -->
  <div class="card">
    <div class="card-header">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        What We Serve
      </h3>
      <span class="toggle-icon open">&#8679;</span>
    </div>
    <div class="card-body">
      <ul class="numbered-list" id="services-list">
        <li><span class="num-badge">01</span>Loading...</li>
      </ul>
    </div>
  </div>

  <!-- ---- OUR PRODUCTS CARD ---- -->
  <div class="card">
    <div class="card-header">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        Our Products
      </h3>
      <span class="toggle-icon open">&#8679;</span>
    </div>
    <div class="card-body">
      <div id="products-list" class="products-list">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <p>Loading products...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ---- FOLLOW US CARD ---- -->
  <div class="card">
    <div class="card-header">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Follow Us
      </h3>
      <span class="toggle-icon open">&#8679;</span>
    </div>
    <div class="card-body">
      <div class="social-row">
        <a id="link-fb" class="social-btn facebook" href="#" target="_blank" rel="noopener" title="Facebook">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
        </a>
        <a id="link-ig" class="social-btn instagram" href="#" target="_blank" rel="noopener" title="Instagram">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        </a>
        <a id="link-li" class="social-btn linkedin" href="#" target="_blank" rel="noopener" title="LinkedIn">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
        </a>
        <a id="link-yt" class="social-btn youtube" href="#" target="_blank" rel="noopener" title="YouTube" style="display:none">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M22.54 6.42a2.78 2.78 0 00-1.95-1.95C18.88 4 12 4 12 4s-6.88 0-8.59.47a2.78 2.78 0 00-1.95 1.95A29 29 0 001 12a29 29 0 00.46 5.58A2.78 2.78 0 003.41 19.5C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 001.95-1.95A29 29 0 0023 12a29 29 0 00-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="#ff0000"/></svg>
        </a>
        <a id="link-tw" class="social-btn twitter" href="#" target="_blank" rel="noopener" title="Twitter/X" style="display:none">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z"/></svg>
        </a>
      </div>
    </div>
  </div>

</div><!-- /main-container -->

<!-- Back to Top -->
<button id="back-to-top" title="Back to top">&#8679;</button>

<!-- Admin FAB -->
<a id="admin-fab" href="admin.html" title="Admin Panel">⚙️</a>

<!-- Toast -->
<div class="toast"></div>

<!-- Scripts -->
<script src="js/data.js"></script>
<script src="js/main.js"></script>

</body>
</html>
